[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-variance-analyzer"
version = "0.2.0"
description = "Score AI agent runs for likely failure from one run, with no answer key, using one JEV read."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
generate = ["numpy>=1.17"]

[project.urls]
Homepage = "https://github.com/BeakrHub/TraceVarianceAnalyzer"

[project.scripts]
trace-variance-analyzer = "trace_variance_analyzer.cli:main"
tva = "trace_variance_analyzer.cli:main"

[tool.setuptools]
packages = ["trace_variance_analyzer"]
